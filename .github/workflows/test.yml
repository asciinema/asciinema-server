name: Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-test-${{ runner.os }}-${{ runner.arch }}
      - name: Cache Mix
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-
      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('flake.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-rust-${{ hashFiles('flake.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-
      - name: Install mix dependencies
        run: nix develop .#ci --command mix deps.get
      - name: Check formatting
        run: nix develop .#ci --command mix format --check-formatted
      - name: Compile
        run: nix develop .#ci --command mix compile
      - name: Lint NIF crates
        run: nix develop .#ci --command cargo clippy --manifest-path native/Cargo.toml --workspace -- -D warnings
      - name: Install npm dependencies
        run: nix develop .#ci --command npm ci --prefix assets
      - name: Setup assets pipeline deps
        run: nix develop .#ci --command mix assets.setup
      - name: Build assets
        run: nix develop .#ci --command mix assets.build
      - name: Run tests
        run: nix develop .#ci --command mix test --include vt
