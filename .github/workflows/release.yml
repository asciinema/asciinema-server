name: Release

on:
  push:
    tags:
      - "v20*"
  # manual dispatch builds both architectures without publishing anything,
  # warming the arm nix cache for later tag runs
  workflow_dispatch:
    inputs:
      push_canary:
        description: "Push the built image to ghcr.io as :canary"
        type: boolean
        default: false

env:
  IMAGE_NAME: asciinema-server

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35

      # restores the nix cache saved by the CI runs on develop
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-build-${{ runner.os }}-${{ runner.arch }}

      - name: Set up outputs
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed -e 's/^v//')
            TAG=$VERSION
          else
            VERSION=canary-$(echo "${{ github.sha }}" | cut -c1-7)
            TAG=canary
          fi
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          {
            echo "VERSION=$VERSION"
            echo "TAG=$TAG"
            echo "IMAGE_ID=$IMAGE_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        run: VERSION="${{ steps.vars.outputs.VERSION }}" nix build --impure .#image

      - name: Load image
        run: ./result | docker load

      - name: Login to GitHub Container Registry
        if: github.ref_type == 'tag' || inputs.push_canary
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the arch image
        if: github.ref_type == 'tag' || inputs.push_canary
        run: |
          arch_tag="${{ steps.vars.outputs.IMAGE_ID }}:${{ steps.vars.outputs.TAG }}-${{ matrix.arch }}"
          docker tag asciinema-server:latest "$arch_tag"
          docker push "$arch_tag"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$arch_tag" | cut -d@ -f2)
          mkdir -p ${{ runner.temp }}/digests
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.ref_type == 'tag' || inputs.push_canary
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref_type == 'tag' || inputs.push_canary
    permissions:
      contents: write
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up outputs
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed -e 's/^v//')
            TAG=$VERSION
          else
            VERSION=canary-$(echo "${{ github.sha }}" | cut -c1-7)
            TAG=canary
          fi
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          {
            echo "VERSION=$VERSION"
            echo "TAG=$TAG"
            echo "IMAGE_ID=$IMAGE_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags="-t ${{ steps.vars.outputs.IMAGE_ID }}:${{ steps.vars.outputs.TAG }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="$tags -t ${{ steps.vars.outputs.IMAGE_ID }}:latest"
          fi
          # shellcheck disable=SC2086,SC2046 # splitting builds the arg lists
          docker buildx imagetools create $tags \
            $(printf '${{ steps.vars.outputs.IMAGE_ID }}@sha256:%s ' *)

      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create ${{ github.ref_name }} --draft --verify-tag --title ${{ steps.vars.outputs.VERSION }}
