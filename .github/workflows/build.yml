name: Build

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: nixbuild/nix-quick-install-action@v35
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-build-${{ runner.os }}-${{ runner.arch }}
    - run: nix build .#default .#image
    # the VM checks need KVM, which GitHub-hosted Linux runners provide
    - run: nix build .#checks.x86_64-linux.nixos-module .#checks.x86_64-linux.oci-image
